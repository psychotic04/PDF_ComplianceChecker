<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">High Level Architecture - PDF Compliance Scanner</title>
  <desc id="desc">Architecture diagram showing Streamlit UI, LangGraph workflow, detection services, storage, metrics, and report generation.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7fb; }
      .panel { fill: #ffffff; stroke: #d7dbe7; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #2f3a4a; stroke-width: 2; }
      .box-blue { fill: #eaf3ff; stroke: #2563eb; }
      .box-green { fill: #ecfdf3; stroke: #16a34a; }
      .box-yellow { fill: #fff7e6; stroke: #d97706; }
      .box-red { fill: #fff1f2; stroke: #e11d48; }
      .box-purple { fill: #f4efff; stroke: #7c3aed; }
      .box-gray { fill: #f8fafc; stroke: #64748b; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 18px Arial, sans-serif; fill: #111827; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #4b5563; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowhead); }
      .pill { fill: #111827; }
      .pill-text { font: 700 12px Arial, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" width="1500" height="980"/>
  <text x="60" y="58" class="title">PDF Compliance Scanner - High Level Architecture</text>
  <text x="60" y="86" class="subtitle">Streamlit UI + LangGraph workflow + Presidio/Gemini/Detoxify checks + SQLite storage + reports and metrics</text>

  <!-- User/UI -->
  <rect x="55" y="130" width="250" height="250" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="85" y="168" class="section">User Interface</text>
  <rect x="85" y="195" width="190" height="70" rx="10" class="box box-blue"/>
  <text x="112" y="225" class="label">Streamlit App</text>
  <text x="108" y="248" class="small">Upload PDF, scan, view</text>
  <rect x="85" y="295" width="190" height="55" rx="10" class="box box-gray"/>
  <text x="112" y="328" class="label">Uploaded PDF</text>

  <!-- LangGraph -->
  <rect x="375" y="120" width="700" height="500" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="405" y="158" class="section">LangGraph Compliance Workflow</text>
  <text x="405" y="181" class="tiny">Temporary state carries pages, chunks, detector results, and performance metrics</text>

  <rect x="420" y="215" width="190" height="78" rx="10" class="box box-blue"/>
  <text x="452" y="244" class="label">Extract PDF</text>
  <text x="444" y="267" class="small">PyMuPDF page text</text>
  <text x="464" y="285" class="tiny">nodes/extract_pdf.py</text>

  <rect x="665" y="215" width="230" height="78" rx="10" class="box box-purple"/>
  <text x="700" y="244" class="label">Recursive Chunking</text>
  <text x="698" y="267" class="small">chunk size 2000, overlap 250</text>
  <text x="722" y="285" class="tiny">state[&quot;chunks&quot;]</text>

  <rect x="420" y="345" width="190" height="78" rx="10" class="box box-green"/>
  <text x="461" y="374" class="label">PII Check</text>
  <text x="440" y="397" class="small">Presidio + custom</text>
  <text x="433" y="415" class="tiny">Aadhaar/PAN recognizers</text>

  <rect x="665" y="345" width="190" height="78" rx="10" class="box box-yellow"/>
  <text x="695" y="374" class="label">Confidential</text>
  <text x="706" y="397" class="small">Gemini API</text>
  <text x="698" y="415" class="tiny">Prompt JSON classifier</text>

  <rect x="910" y="345" width="190" height="78" rx="10" class="box box-red"/>
  <text x="956" y="374" class="label">Abusive</text>
  <text x="957" y="397" class="small">Detoxify</text>
  <text x="929" y="415" class="tiny">toxicity pretrained model</text>

  <rect x="420" y="475" width="190" height="78" rx="10" class="box box-gray"/>
  <text x="455" y="504" class="label">Encoding</text>
  <text x="432" y="527" class="small">UTF-8, symbols, English</text>
  <text x="453" y="545" class="tiny">langdetect + Unicode</text>

  <rect x="665" y="475" width="230" height="78" rx="10" class="box box-purple"/>
  <text x="704" y="504" class="label">Aggregate Results</text>
  <text x="690" y="527" class="small">Chunk decisions mapped</text>
  <text x="728" y="545" class="tiny">back to pages</text>

  <!-- Services -->
  <rect x="1135" y="120" width="300" height="500" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="1165" y="158" class="section">Services / Models</text>

  <rect x="1175" y="195" width="220" height="58" rx="10" class="box box-green"/>
  <text x="1220" y="229" class="label">Presidio PII</text>

  <rect x="1175" y="275" width="220" height="58" rx="10" class="box box-yellow"/>
  <text x="1218" y="310" class="label">Gemini 2.5 Flash</text>

  <rect x="1175" y="355" width="220" height="58" rx="10" class="box box-red"/>
  <text x="1235" y="390" class="label">Detoxify</text>

  <rect x="1175" y="435" width="220" height="58" rx="10" class="box box-blue"/>
  <text x="1214" y="470" class="label">ReportLab PDF</text>

  <rect x="1175" y="515" width="220" height="58" rx="10" class="box box-gray"/>
  <text x="1218" y="550" class="label">python-dotenv</text>

  <!-- Storage -->
  <rect x="120" y="685" width="510" height="230" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="150" y="723" class="section">SQLite Storage</text>
  <text x="150" y="746" class="tiny">database/compliance.db</text>

  <rect x="150" y="775" width="135" height="55" rx="9" class="box box-gray"/>
  <text x="184" y="808" class="label">scans</text>

  <rect x="310" y="775" width="180" height="55" rx="9" class="box box-gray"/>
  <text x="332" y="808" class="label">compliance_results</text>

  <rect x="150" y="850" width="185" height="55" rx="9" class="box box-gray"/>
  <text x="169" y="883" class="label">chunk_analysis_cache</text>

  <rect x="360" y="850" width="175" height="55" rx="9" class="box box-gray"/>
  <text x="385" y="883" class="label">metrics tables</text>

  <!-- Output -->
  <rect x="760" y="685" width="620" height="230" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="790" y="723" class="section">Outputs</text>

  <rect x="795" y="775" width="180" height="70" rx="10" class="box box-blue"/>
  <text x="828" y="805" class="label">UI Results</text>
  <text x="820" y="828" class="small">page-wise findings</text>

  <rect x="1010" y="775" width="180" height="70" rx="10" class="box box-purple"/>
  <text x="1035" y="805" class="label">PDF Report</text>
  <text x="1040" y="828" class="small">downloadable file</text>

  <rect x="1225" y="775" width="180" height="70" rx="10" class="box box-green"/>
  <text x="1248" y="805" class="label">Dashboards</text>
  <text x="1240" y="828" class="small">usage + performance</text>

  <rect x="905" y="865" width="330" height="45" rx="10" class="box box-yellow"/>
  <text x="948" y="893" class="label">Compliance Score + Violations</text>

  <!-- arrows -->
  <path class="arrow" d="M275 230 C330 230, 345 230, 420 240"/>
  <path class="arrow" d="M610 254 L665 254"/>
  <path class="arrow" d="M780 293 L780 330 L515 330 L515 345"/>
  <path class="arrow" d="M610 384 L665 384"/>
  <path class="arrow" d="M855 384 L910 384"/>
  <path class="arrow" d="M515 423 L515 475"/>
  <path class="arrow" d="M610 514 L665 514"/>
  <path class="arrow" d="M780 553 C780 625, 520 620, 405 685"/>
  <path class="arrow" d="M895 514 C1010 560, 1130 640, 1100 775"/>
  <path class="dash" d="M855 384 C990 300, 1090 305, 1175 305"/>
  <path class="dash" d="M610 384 C850 240, 990 225, 1175 225"/>
  <path class="dash" d="M1100 384 C1140 384, 1150 384, 1175 384"/>
  <path class="dash" d="M895 514 C1010 480, 1090 465, 1175 465"/>
  <path class="arrow" d="M630 800 C695 800, 735 800, 795 810"/>
  <path class="arrow" d="M630 865 C780 900, 850 890, 905 890"/>
  <path class="arrow" d="M1190 810 L1225 810"/>

  <!-- legend -->
  <rect x="60" y="940" width="18" height="18" rx="4" class="box-blue"/>
  <text x="88" y="954" class="tiny">UI / extraction</text>
  <rect x="190" y="940" width="18" height="18" rx="4" class="box-green"/>
  <text x="218" y="954" class="tiny">PII / local NLP</text>
  <rect x="345" y="940" width="18" height="18" rx="4" class="box-yellow"/>
  <text x="373" y="954" class="tiny">Gemini LLM</text>
  <rect x="480" y="940" width="18" height="18" rx="4" class="box-red"/>
  <text x="508" y="954" class="tiny">Toxicity model</text>
  <rect x="650" y="940" width="18" height="18" rx="4" class="box-purple"/>
  <text x="678" y="954" class="tiny">Aggregation / report</text>
</svg>
